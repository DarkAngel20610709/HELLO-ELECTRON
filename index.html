<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Note Taker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, sans-serif;
            background: #f4f4f4;
            min-height: 100vh;
        }

        #app {
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 220px;
            background: #2b2b2b;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 8px;
        }

        #note-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 10px;
        }

        #note-title {
            font-size: 18px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            flex: 1;
            font-size: 16px;
            padding: 12px;
            resize: none;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        #toolbar {
            display: flex;
            gap: 8px;
        }

        button {
            padding: 8px 12px;
        }

        #save_status {
            font-size: 14px;
            color: #333;
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="sidebar">
            <button id="new-note">New Note</button>
            <div id="note-list"></div>
        </div>
        <div id="editor">
            <input type="text" id="note-title" placeholder="Note title ...">
            <textarea id="note" placeholder="Start typing your note"></textarea>
            <div id="toolbar">
                <button id="save">Save</button>
                <button id="save-as">Save As</button>
                <button id="open-file">Open File</button>
            </div>
            <p id="save_status"></p>
            <span id="word-count">Words: 0 | Characters: 0</span>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>

</html>
